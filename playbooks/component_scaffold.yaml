id: component_scaffold
name: Rapid Component & Module Scaffolding
category: Development
role: Developer
when_to_use: Quickly build a single isolated endpoint, service, or UI component with automated test verification without running a full 7-step SDLC
description: Fast-path engineering pipeline for implementing a single isolated module, API endpoint, or UI component directly with automated test verification.
default_gates:
  - execution

steps:
  - id: spec
    name: Component Specification & Interface Contract (Architect)
    lens: lenses/architect.md
    toolbox:
      - fs_read
      - analysis
      - context7
      - fs_write
    standards:
      - knowledge/anti_hallucination.md
      - knowledge/testing_standard.md
    output_artifact: docs/pages/{{args}}-spec.md

  - id: implement_and_test
    name: Implementation & Test Verification (Backend/Frontend)
    lens: lenses/backend.md
    toolbox:
      - fs_read
      - fs_write
      - git
      - verification
      - stitch
    standards:
      - knowledge/testing_standard.md
      - knowledge/git_standard.md
    hard_checks:
      - detect:test
      - detect:lint
    input_artifacts:
      - docs/pages/{{args}}-spec.md
    gate: execution
