id: workflow_dev
name: Event-Driven Workflow Automation Pipeline
category: Automation
role: Automation Architect
when_to_use: Design and implement event-driven integration workflows (n8n, webhooks, asynchronous DAGs) with idempotency and retry resilience
description: End-to-end automation workflow engineering covering payload discovery, integration DAG implementation, and defensive failure recovery verification.
default_gates:
  - discovery
  - execution

steps:
  - id: payload_discovery
    name: Payload Discovery & Auth Modeling
    lens: lenses/automata.md
    toolbox:
      - fs_read
      - search_web
      - fs_write
    standards:
      - knowledge/auth_standard.md
    output_artifact: docs/pages/{{args}}-payload-spec.md
    gate: discovery

  - id: dag_implementation
    name: Workflow DAG & Transformation Logic
    lens: lenses/automata.md
    toolbox:
      - fs_read
      - fs_write
    input_artifacts:
      - docs/pages/{{args}}-payload-spec.md
    output_artifact: workflows/{{args}}.json
    gate: execution

  - id: resilience_verification
    name: Failure Recovery & Error Path Verification
    lens: lenses/qa.md
    toolbox:
      - verification
      - fs_read
    standards:
      - knowledge/testing_standard.md
    hard_checks:
      - auto_detect: true
        fallback: npm test
    gate: null
